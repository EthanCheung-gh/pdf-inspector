name: PDF Inspector Diff
description: >-
  Compare two local PDF files object by object, write JSON/HTML reports and fail
  the step when differences match the configured policy.

branding:
  icon: file-text
  color: blue

inputs:
  old:
    description: >-
      Baseline PDF path, absolute or relative to the workspace. Local files
      only; http(s) URLs are rejected.
    required: true
  new:
    description: >-
      Revised PDF path, absolute or relative to the workspace. Local files
      only; http(s) URLs are rejected.
    required: true
  fail-on:
    description: >-
      Which differences fail the step: any, added, removed, modified,
      page-count, reordered or none. "reordered" fails when a paired page moved
      to a different page number. "none" always exits 0.
    required: false
    default: any
  ignore-regions:
    description: >-
      Optional path to a JSON array of drawn ignore regions (camelCase
      oldPage/newPage/bbox, MediaBox-relative PDF points). Changes
      intersecting a region are not reported; the result echoes the masks under
      options.ignoreRegions.
    required: false
    default: ''
  ignore-annotations:
    description: >-
      Set to true to skip the annotation comparison (comments, highlights and
      other markup). Defaults to false so annotation changes are reported.
    required: false
    default: 'false'
  ignore-links:
    description: >-
      Set to true to skip the link comparison (URI targets and internal
      destinations). Defaults to false.
    required: false
    default: 'false'
  ignore-forms:
    description: >-
      Set to true to skip the form widget comparison (field values, defaults and
      options). Defaults to false.
    required: false
    default: 'false'
  ignore-metadata:
    description: >-
      Set to true to skip the document metadata comparison (title, author,
      subject, keywords, creator, producer, dates, language). Defaults to false.
    required: false
    default: 'false'
  ignore-page-labels:
    description: >-
      Set to true to skip the page label (/PageLabels) comparison. Defaults to
      false.
    required: false
    default: 'false'
  format:
    description: >-
      Primary output used for the step summary and default artifact path:
      summary, json or html. JSON/HTML payloads are written to files, not the log.
    required: false
    default: summary
  json-path:
    description: >-
      Where to write the JSON DiffResult. Defaults to the runner temp directory
      when format is json; set it explicitly to keep JSON alongside a
      summary/html run (that adds one extra CLI pass).
    required: false
    default: ''
  report-path:
    description: >-
      Where to write the standalone HTML report. Defaults to the runner temp
      directory when format is html; set it explicitly to keep HTML alongside a
      summary/json run (that adds one extra CLI pass).
    required: false
    default: ''
  python-version:
    description: Python version used to run the diff CLI.
    required: false
    default: '3.12'

outputs:
  exit-code:
    description: >-
      CLI exit code: 0 no failure, 1 fail-on matched, 2 usage/read/diff error.
      Always 0 when fail-on is none.
    value: ${{ steps.diff.outputs.exit-code }}
  json-path:
    description: >-
      Path of the JSON result written by this run (as given, so relative inputs
      stay workspace-relative), or empty when no JSON artifact was requested or
      produced.
    value: ${{ steps.diff.outputs.json-path }}
  report-path:
    description: >-
      Path of the HTML report written by this run (as given, so relative inputs
      stay workspace-relative), or empty when no HTML artifact was requested or
      produced.
    value: ${{ steps.diff.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        INPUT_OLD: ${{ inputs.old }}
        INPUT_NEW: ${{ inputs.new }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_IGNORE_REGIONS: ${{ inputs.ignore-regions }}
        INPUT_IGNORE_ANNOTATIONS: ${{ inputs.ignore-annotations }}
        INPUT_IGNORE_LINKS: ${{ inputs.ignore-links }}
        INPUT_IGNORE_FORMS: ${{ inputs.ignore-forms }}
        INPUT_IGNORE_METADATA: ${{ inputs.ignore-metadata }}
        INPUT_IGNORE_PAGE_LABELS: ${{ inputs.ignore-page-labels }}
      run: |
        set -euo pipefail

        error() {
          echo "::error::$*"
          exit 2
        }

        for pair in "old:$INPUT_OLD" "new:$INPUT_NEW"; do
          label="${pair%%:*}"
          value="${pair#*:}"
          lowered="$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')"
          if [ -z "$value" ]; then
            error "input '$label' is required (path to a local PDF file)"
          fi
          case "$lowered" in
            http://* | https://*)
              error "input '$label' must be a local path, not a URL: $value (remote inputs are not supported)"
              ;;
          esac
          if [ ! -f "$value" ]; then
            error "input '$label' file not found (relative to $PWD): $value"
          fi
        done

        case "$INPUT_FAIL_ON" in
          any | added | removed | modified | page-count | reordered | none) ;;
          *)
            error "input 'fail-on' must be one of any, added, removed, modified, page-count, reordered, none (got '$INPUT_FAIL_ON')"
            ;;
        esac

        case "$INPUT_FORMAT" in
          summary | json | html) ;;
          *)
            error "input 'format' must be one of summary, json, html (got '$INPUT_FORMAT')"
            ;;
        esac

        if [ -n "$INPUT_IGNORE_REGIONS" ]; then
          if [ ! -e "$INPUT_IGNORE_REGIONS" ]; then
            error "input 'ignore-regions' file not found (relative to $PWD): $INPUT_IGNORE_REGIONS"
          fi
          if [ ! -f "$INPUT_IGNORE_REGIONS" ]; then
            error "input 'ignore-regions' must be a JSON file, not a directory: $INPUT_IGNORE_REGIONS"
          fi
          if [ ! -s "$INPUT_IGNORE_REGIONS" ]; then
            error "input 'ignore-regions' file is empty: $INPUT_IGNORE_REGIONS"
          fi
        fi

        # Resource switches are boolean-like strings: true or false (any case).
        # An unset/empty value means false, so callers that predate the inputs
        # keep the default "compare every resource" behaviour.
        for pair in \
          "ignore-annotations:${INPUT_IGNORE_ANNOTATIONS:-false}" \
          "ignore-links:${INPUT_IGNORE_LINKS:-false}" \
          "ignore-forms:${INPUT_IGNORE_FORMS:-false}" \
          "ignore-metadata:${INPUT_IGNORE_METADATA:-false}" \
          "ignore-page-labels:${INPUT_IGNORE_PAGE_LABELS:-false}"; do
          label="${pair%%:*}"
          value="${pair#*:}"
          lowered="$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')"
          case "$lowered" in
            '' | true | false) ;;
            *)
              error "input '$label' must be true or false (got '$value')"
              ;;
          esac
        done

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install diff dependencies
      shell: bash
      env:
        REQUIREMENTS: ${{ github.action_path }}/sidecar/requirements.txt
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install -r "$REQUIREMENTS"
        python -c "import pdfplumber"  # fail early when the install is broken

    - name: Run PDF diff
      id: diff
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_OLD: ${{ inputs.old }}
        INPUT_NEW: ${{ inputs.new }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_JSON_PATH: ${{ inputs.json-path }}
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
        INPUT_IGNORE_REGIONS: ${{ inputs.ignore-regions }}
        INPUT_IGNORE_ANNOTATIONS: ${{ inputs.ignore-annotations }}
        INPUT_IGNORE_LINKS: ${{ inputs.ignore-links }}
        INPUT_IGNORE_FORMS: ${{ inputs.ignore-forms }}
        INPUT_IGNORE_METADATA: ${{ inputs.ignore-metadata }}
        INPUT_IGNORE_PAGE_LABELS: ${{ inputs.ignore-page-labels }}
        RUNNER_TEMP_DIR: ${{ runner.temp }}
      run: |
        set -uo pipefail

        cli="${ACTION_PATH}/sidecar/cli.py"
        if [ ! -f "$cli" ]; then
          echo "::error::cannot find the diff CLI at $cli"
          exit 2
        fi

        fail_on="$INPUT_FAIL_ON"
        format="$INPUT_FORMAT"
        json_path="$INPUT_JSON_PATH"
        report_path="$INPUT_REPORT_PATH"

        ensure_parent() {
          local path="$1" parent
          [ -n "$path" ] || return 0
          parent="$(dirname -- "$path")"
          [ -z "$parent" ] || [ -d "$parent" ] || mkdir -p -- "$parent"
        }

        # Default artifacts live in the runner temp directory so nothing is
        # written into the repository; callers override with json-path/report-path.
        if [ -z "$json_path" ] && [ "$format" = "json" ]; then
          json_path="${RUNNER_TEMP_DIR}/pdf-inspector-diff.json"
        fi
        if [ -z "$report_path" ] && [ "$format" = "html" ]; then
          report_path="${RUNNER_TEMP_DIR}/pdf-inspector-report.html"
        fi

        primary_output=""
        case "$format" in
          json) primary_output="$json_path" ;;
          html) primary_output="$report_path" ;;
        esac
        ensure_parent "$primary_output"

        args=(diff "$INPUT_OLD" "$INPUT_NEW" --format "$format" --fail-on "$fail_on")
        if [ -n "$primary_output" ]; then
          args+=(--output "$primary_output")
        fi
        # Drawn ignore regions apply to every pass, so JSON, HTML and the step
        # summary always describe the same masked result.
        region_args=()
        if [ -n "$INPUT_IGNORE_REGIONS" ]; then
          region_args=(--ignore-regions "$INPUT_IGNORE_REGIONS")
          args+=("${region_args[@]}")
        fi

        # Resource switches apply to every pass for the same reason: the primary
        # run, the secondary JSON/HTML artifacts and the step summary counts must
        # all compare the same resource kinds.
        resource_args=()
        add_resource_flag() {
          local value="$1" flag="$2"
          value="$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')"
          if [ "$value" = "true" ]; then
            resource_args+=("$flag")
          fi
        }
        add_resource_flag "${INPUT_IGNORE_ANNOTATIONS:-false}" --ignore-annotations
        add_resource_flag "${INPUT_IGNORE_LINKS:-false}" --ignore-links
        add_resource_flag "${INPUT_IGNORE_FORMS:-false}" --ignore-forms
        add_resource_flag "${INPUT_IGNORE_METADATA:-false}" --ignore-metadata
        add_resource_flag "${INPUT_IGNORE_PAGE_LABELS:-false}" --ignore-page-labels
        args+=(${resource_args[@]+"${resource_args[@]}"})

        echo "::group::python ${cli} ${args[*]}"
        # GitHub's bash shell enables `-e`; a non-zero diff exit is expected
        # when --fail-on matches, so capture it instead of aborting before the
        # action outputs are written.
        set +e
        python "$cli" "${args[@]}"
        exit_code=$?
        set -e
        echo "::endgroup::"

        # A run that was asked for a payload file must leave one behind; a
        # missing file usually means the Python environment is broken, and an
        # interpreter failure also exits 1 like a real diff failure.
        if [ -n "$primary_output" ] && [ ! -s "$primary_output" ]; then
          echo "::error::pdf-inspector did not write $primary_output (exit code $exit_code); see the CLI error above (broken Python environment or invalid input PDF)"
          exit 2
        fi

        # json-path/report-path may name the artifact of the *other* format;
        # produce it with a quiet, non-failing second pass.
        secondary_exit=0
        write_secondary() {
          local payload_format="$1" path="$2"
          [ -n "$path" ] || return 0
          ensure_parent "$path"
          python "$cli" diff "$INPUT_OLD" "$INPUT_NEW" \
            --format "$payload_format" --output "$path" --fail-on none --quiet \
            ${region_args[@]+"${region_args[@]}"} \
            ${resource_args[@]+"${resource_args[@]}"}
        }

        if [ "$format" != "json" ] && [ -n "$INPUT_JSON_PATH" ]; then
          set +e
          write_secondary json "$json_path"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            secondary_exit=$status
            echo "::error::failed to write the JSON result to $json_path"
            json_path=""
          fi
        fi
        if [ "$format" != "html" ] && [ -n "$INPUT_REPORT_PATH" ]; then
          set +e
          write_secondary html "$report_path"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            secondary_exit=$status
            echo "::error::failed to write the HTML report to $report_path"
            report_path=""
          fi
        fi

        # Page counts, reorder count and region count for the step summary come
        # from the JSON result: reuse the JSON artifact when this run wrote one,
        # otherwise do one bounded, non-failing JSON pass. Only counts and page
        # numbers are printed - never PDF text or object payloads.
        summary_json=""
        if [ "$format" = "json" ] && [ -n "$json_path" ] && [ -s "$json_path" ]; then
          summary_json="$json_path"
        else
          summary_json="${RUNNER_TEMP_DIR}/pdf-inspector-diff-summary.json"
          ensure_parent "$summary_json"
          set +e
          python "$cli" diff "$INPUT_OLD" "$INPUT_NEW" \
            --format json --output "$summary_json" --fail-on none --quiet \
            ${region_args[@]+"${region_args[@]}"} \
            ${resource_args[@]+"${resource_args[@]}"}
          status=$?
          set -e
          if [ "$status" -ne 0 ] || [ ! -s "$summary_json" ]; then
            summary_json=""
          fi
        fi

        {
          echo "exit-code=$exit_code"
          echo "json-path=$json_path"
          echo "report-path=$report_path"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### PDF diff: \`$INPUT_OLD\` -> \`$INPUT_NEW\`"
          echo
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| exit code | \`$exit_code\` |"
          echo "| fail-on | \`$fail_on\` |"
          echo "| format | \`$format\` |"
          if [ -n "$INPUT_IGNORE_REGIONS" ]; then
            echo "| ignore regions | \`$INPUT_IGNORE_REGIONS\` |"
          fi
          if [ -n "$json_path" ]; then
            echo "| JSON | \`$json_path\` |"
          fi
          if [ -n "$report_path" ]; then
            echo "| HTML | \`$report_path\` |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        summary_md="${RUNNER_TEMP_DIR}/pdf-inspector-diff-summary.md"
        if [ -n "$summary_json" ]; then
          ensure_parent "$summary_md"
          set +e
          python - "$summary_json" > "$summary_md" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding='utf-8') as handle:
            data = json.load(handle)

        summary = data.get('summary') or {}
        old = data.get('old') or {}
        new = data.get('new') or {}
        regions = (data.get('options') or {}).get('ignoreRegions') or []


        def count(key):
            try:
                return int(summary.get(key) or 0)
            except (TypeError, ValueError):
                return 0


        def page_label(page):
            old_index = page.get('oldIndex')
            new_index = page.get('newIndex')
            if old_index is not None and new_index is not None:
                return str(old_index) if old_index == new_index else '%s/%s' % (old_index, new_index)
            if new_index is not None:
                return 'new %s' % new_index
            if old_index is not None:
                return 'old %s' % old_index
            return '?'


        changed = [
            page_label(page)
            for page in data.get('pages') or []
            if isinstance(page, dict) and page.get('status') == 'changed'
        ]
        limit = 20
        changed_pages = ', '.join(changed[:limit]) if changed else 'none'
        if len(changed) > limit:
            changed_pages += ' (+%d more)' % (len(changed) - limit)

        rows = [
            ('pages (old -> new)', '%s -> %s' % (old.get('pages', '?'), new.get('pages', '?'))),
            (
                'pages added / removed / changed / reordered',
                '%d / %d / %d / %d'
                % (
                    count('pagesAdded'),
                    count('pagesRemoved'),
                    count('pagesChanged'),
                    count('pagesReordered'),
                ),
            ),
            ('changed pages', changed_pages),
            ('ignored regions', str(len(regions))),
        ]

        print()
        print('| Metric | Value |')
        print('| --- | --- |')
        for name, value in rows:
            print('| %s | %s |' % (name, value))
        PY
          status=$?
          set -e
          if [ "$status" -eq 0 ] && [ -s "$summary_md" ]; then
            cat "$summary_md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::could not summarise $summary_json for the step summary"
          fi
        fi

        if [ "$exit_code" -ne 0 ]; then
          echo "::error::pdf-inspector diff exited with code $exit_code (1 = differences matched --fail-on $fail_on, 2 = usage/read/diff error)"
          exit "$exit_code"
        fi
        if [ "$secondary_exit" -ne 0 ]; then
          exit "$secondary_exit"
        fi
