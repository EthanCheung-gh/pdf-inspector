          assert len(attachments['notes.txt']['sha256'] or '') == 64, attachments

          assert len(data['javascript']) == 2, data['javascript']
          subtypes = {item['subtype'] for item in data['actions']}
          assert {'JavaScript', 'URI'} <= subtypes, subtypes

          signatures = data['signatures']
          assert signatures and signatures[0]['fieldName'] == 'Approval', signatures
          assert signatures[0]['verified'] is False, signatures

