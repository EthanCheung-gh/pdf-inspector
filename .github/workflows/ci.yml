  audit-action:
    name: PDF audit action
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sample generation dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab

      - name: Generate sample PDFs
        run: python scripts/generate-web-samples.py

      - name: Audit a sample PDF through the action (expect success)
        id: audit
        uses: ./audit
        with:
          path: web-samples/basic.pdf
          fail-on: none
          format: summary
          report-path: audit-artifacts/action-report.html

      - name: Assert the action outputs and report
        env:
          EXIT_CODE: ${{ steps.audit.outputs.exit-code }}
          REPORT_PATH: ${{ steps.audit.outputs.report-path }}
        run: |
          set -euo pipefail
          echo "exit-code=$EXIT_CODE report-path=$REPORT_PATH"
          test "$EXIT_CODE" = "0"
          test -n "$REPORT_PATH"
          test -f "$REPORT_PATH"
          test -s "$REPORT_PATH"
          grep -q '<!DOCTYPE html>' "$REPORT_PATH"

      - name: Audit a sample PDF to SARIF through the action (expect success)
        id: sarif
        uses: ./audit
        with:
          path: web-samples/basic.pdf
          fail-on: none
          format: sarif
          sarif-path: audit-artifacts/action.sarif

      - name: Assert the action wrote a parsable SARIF payload
        env:
          EXIT_CODE: ${{ steps.sarif.outputs.exit-code }}
          SARIF_PATH: ${{ steps.sarif.outputs.sarif-path }}
        run: |
          set -euo pipefail
          echo "exit-code=$EXIT_CODE sarif-path=$SARIF_PATH"
          test "$EXIT_CODE" = "0"
          test -n "$SARIF_PATH"
          test -f "$SARIF_PATH"
          test -s "$SARIF_PATH"

          python - "$SARIF_PATH" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['$schema'] == 'https://json.schemastore.org/sarif-2.1.0.json'
          assert data['version'] == '2.1.0', data['version']

          run = data['runs'][0]
          driver = run['tool']['driver']
          assert driver['name'] == 'pdf-inspector', driver['name']
          rules = {rule['id'] for rule in driver['rules']}
          results = run['results']
          assert rules, 'no SARIF rules'
          assert results, 'no SARIF results'
          for result in results:
              assert result['ruleId'] in rules, result
              assert result['level'] in {'error', 'warning', 'note'}, result
              assert result['message']['text'], result
              assert result['partialFingerprints']['pdfInspectorFinding/v1'], result
          print('action SARIF OK:', len(results), 'result(s)')
          PY

      - name: Audit with a missing baseline through the action (expected failure)
        id: missing-baseline
        continue-on-error: true
        uses: ./audit
        with:
          path: web-samples/basic.pdf
          fail-on: none
          format: sarif
          sarif-path: audit-artifacts/missing-baseline.sarif
          baseline-path: audit-artifacts/does-not-exist.json

      - name: Assert the rejected baseline failed before any payload was written
        env:
          OUTCOME: ${{ steps.missing-baseline.outcome }}
        run: |
          set -euo pipefail
          echo "outcome=$OUTCOME"
          # The input validation step rejects the missing file: the step fails
          # (before Python is installed) and no SARIF payload is left behind.
          test "$OUTCOME" = "failure"
          if [ -e audit-artifacts/missing-baseline.sarif ]; then
            echo "::error::a rejected baseline must not produce a payload"
            exit 1
          fi

      - name: Prepare a small directory audit fixture
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts audit-fixtures/reports
          cp web-samples/accessibility-valid.pdf audit-fixtures/clean.pdf
          cp web-samples/accessibility-broken.pdf audit-fixtures/reports/warned.pdf
          test "$(find audit-fixtures -name '*.pdf' | wc -l)" -eq 2

      - name: Audit the fixture directory through the action (expect success)
        id: audit-dir
        uses: ./audit
        with:
          path: audit-fixtures
          fail-on: none
          format: json
          json-path: audit-artifacts/action-directory.json
          report-path: audit-artifacts/action-directory.html

      - name: Assert the directory action outputs, artifact and step summary
        env:
          EXIT_CODE: ${{ steps.audit-dir.outputs.exit-code }}
          JSON_PATH: ${{ steps.audit-dir.outputs.json-path }}
          REPORT_PATH: ${{ steps.audit-dir.outputs.report-path }}
          SARIF_PATH: ${{ steps.audit-dir.outputs.sarif-path }}
          # The stats artifact always lands in the runner temp directory.
          STATS_PATH: ${{ runner.temp }}/pdf-inspector-audit-stats.json
        run: |
          set -euo pipefail
          echo "exit-code=$EXIT_CODE json-path=$JSON_PATH report-path=$REPORT_PATH sarif-path=$SARIF_PATH"
          test "$EXIT_CODE" = "0"
          test -n "$JSON_PATH"
          test -f "$JSON_PATH"
          test -n "$REPORT_PATH"
          test -s "$REPORT_PATH"
          # Directory mode has no SARIF output.
          test -z "$SARIF_PATH"
          test -s "$STATS_PATH"
          grep -q '<!DOCTYPE html>' "$REPORT_PATH"

          python - "$JSON_PATH" "$STATS_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['root']['name'] == 'audit-fixtures', data['root']
          summary = data['summary']
          assert summary['files'] == 2, summary
          assert summary['audited'] == 2, summary
          assert summary['failed'] == 0, summary
          assert summary['warnings'] == 5, summary
          assert [entry['path'] for entry in data['files']] == [
              'clean.pdf',
              'reports/warned.pdf',
          ], data['files']

          stats = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          assert list(stats) == ['schemaVersion', 'tool', 'root', 'summary'], list(stats)
          assert 'files' not in stats, stats
          assert stats['summary'] == summary, (stats['summary'], summary)
          print('directory action OK:', summary)
          PY

      - name: Audit a directory with a baseline through the action (expected failure)
        id: directory-baseline
        continue-on-error: true
        uses: ./audit
        with:
          path: audit-fixtures
          fail-on: none
          format: json
          json-path: audit-artifacts/action-directory-baseline.json
          baseline-path: audit-artifacts/audit-baseline.json

      - name: Assert the rejected directory baseline failed before any payload was written
        env:
          OUTCOME: ${{ steps.directory-baseline.outcome }}
        run: |
          set -euo pipefail
          echo "outcome=$OUTCOME"
          # The input validation step rejects baseline-path for a directory: the
          # step fails (before Python is installed) and no payload is left behind.
          test "$OUTCOME" = "failure"
          if [ -e audit-artifacts/action-directory-baseline.json ]; then
            echo "::error::a rejected directory baseline must not produce a payload"
            exit 1
          fi
