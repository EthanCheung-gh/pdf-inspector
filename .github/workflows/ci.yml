          PY

      - name: Render the security HTML report (expect exit 0)
        run: |
          set -euo pipefail

          set +e
          python sidecar/cli.py security web-samples/security-sample.pdf \
            --format html \
            --output security-artifacts/security.html \
            --fail-on none
          code=$?
          set -e

          echo "pdf-inspector exited with $code"
          if [ "$code" -ne 0 ]; then
            echo "::error::expected exit 0 with --fail-on none, got $code"
            exit 1
          fi

          test -s security-artifacts/security.html
          grep -q '<!DOCTYPE html>' security-artifacts/security.html
          grep -q 'PDF security report' security-artifacts/security.html
          if grep -q '<script' security-artifacts/security.html; then
            echo "::error::security HTML report must not contain scripts"
            exit 1
          fi
          echo "HTML report: $(wc -c < security-artifacts/security.html) bytes"

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-security-artifacts
          path: security-artifacts/
          if-no-files-found: ignore
          retention-days: 7

