name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        # Tests mock Electron, so the ~100 MB binary is not needed in CI.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements.txt pytest reportlab

      - name: Type-check (Node and renderer projects)
        run: npx tsc -b

      - name: Type-check (web build)
        run: npx tsc -p tsconfig.web.json

      - name: Run frontend tests
        run: npx vitest run

      - name: Run sidecar tests
        run: python -m pytest sidecar/__tests__ -q

      - name: Build desktop app
        run: npm run build

      - name: Build web client
        run: npm run build:web

      - name: Build web server
        run: npm run build:web-server

      - name: Generate web sample PDFs
        run: python scripts/generate-web-samples.py

  diff-cli:
    name: PDF diff CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements.txt reportlab

      - name: Generate sample PDFs
        run: python scripts/generate-web-samples.py

      - name: Diff identical PDFs (expect exit 0 and JSON output)
        run: |
          set -euo pipefail
          mkdir -p diff-artifacts

          set +e
          python sidecar/cli.py diff web-samples/basic.pdf web-samples/basic.pdf \
            --format json \
            --output diff-artifacts/identical.json \
            --fail-on any
          code=$?
          set -e

          echo "pdf-inspector exited with $code"
          if [ "$code" -ne 0 ]; then
            echo "::error::expected exit 0 for identical PDFs, got $code"
            exit 1
          fi

      - name: Assert identical PDFs report no changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('diff-artifacts/identical.json').read_text(encoding='utf-8'))
          assert data['schemaVersion'] == 1, data['schemaVersion']
          summary = data['summary']
          assert not any(summary.values()), summary
          assert data['old']['sha256'] == data['new']['sha256'], (data['old'], data['new'])
          assert data['old']['pages'] == data['new']['pages']
          print('identical diff OK:', summary)
          PY

      - name: Diff changed PDFs (expect exit 1)
        run: |
          set -euo pipefail

          set +e
          python sidecar/cli.py diff web-samples/basic.pdf web-samples/large.pdf \
            --format json \
            --output diff-artifacts/changed.json \
            --fail-on any
          code=$?
          set -e

          echo "pdf-inspector exited with $code"
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 for changed PDFs with --fail-on any, got $code"
            exit 1
          fi

      - name: Assert changed PDFs JSON reports differences
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('diff-artifacts/changed.json').read_text(encoding='utf-8'))
          summary = data['summary']
          changed = sum(int(value or 0) for value in summary.values())
          assert changed > 0, summary
          assert data['old']['pages'] == 4, data['old']['pages']
          assert data['new']['pages'] == 120, data['new']['pages']
          print('changed diff OK:', summary)
          PY

      # The reordered pair is part of the G5 follow-up sample work (see
      # .openbitfun/plans/diff-2.plan.md). The guard keeps an older checkout
      # without the generated fixture green; this repository generates the
      # files in the step above, so the assertions below always run for real.
      - name: Diff reordered PDFs with --fail-on reordered
        env:
          REORDERED_BASELINE: web-samples/diff-reordered-old.pdf
          REORDERED_FIXTURE: web-samples/diff-reordered.pdf
        run: |
          set -euo pipefail

          if [ ! -f "$REORDERED_FIXTURE" ]; then
            echo "::notice::$REORDERED_FIXTURE not generated yet (G5 follow-up); skipping the reordered assertion"
            exit 0
          fi

          set +e
          python sidecar/cli.py diff "$REORDERED_BASELINE" "$REORDERED_FIXTURE" \
            --format json \
            --output diff-artifacts/reordered.json \
            --fail-on reordered
          code=$?
          set -e

          echo "pdf-inspector exited with $code"
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 for reordered PDFs with --fail-on reordered, got $code"
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('diff-artifacts/reordered.json').read_text(encoding='utf-8'))
          summary = data['summary']
          assert summary['pagesReordered'] > 0, summary
          assert any(
              isinstance(page.get('match'), dict) and page['match'].get('reordered')
              for page in data['pages']
          ), 'no reordered page pair in the JSON result'
          print('reordered diff OK:', summary)
          PY

      - name: Render HTML report and tolerate differences (expect exit 0)
        run: |
          set -euo pipefail

          set +e
          python sidecar/cli.py diff web-samples/basic.pdf web-samples/large.pdf \
            --format html \
            --output diff-artifacts/report.html \
            --fail-on none
          code=$?
          set -e

          echo "pdf-inspector exited with $code"
          if [ "$code" -ne 0 ]; then
            echo "::error::expected exit 0 with --fail-on none, got $code"
            exit 1
          fi

          test -s diff-artifacts/report.html
          grep -q '<!DOCTYPE html>' diff-artifacts/report.html
          grep -q 'PDF diff report' diff-artifacts/report.html
          echo "HTML report: $(wc -c < diff-artifacts/report.html) bytes"

      - name: Upload diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-diff-artifacts
          path: diff-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  diff-action:
    name: PDF diff action
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sample generation dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab

      - name: Generate sample PDFs
        run: python scripts/generate-web-samples.py

      - name: Diff identical PDFs through the action (expect success)
        id: identical
        uses: ./
        with:
          old: web-samples/basic.pdf
          new: web-samples/basic.pdf
          fail-on: any
          format: json
          json-path: diff-artifacts/action-identical.json

      - name: Assert the action outputs
        env:
          EXIT_CODE: ${{ steps.identical.outputs.exit-code }}
          JSON_PATH: ${{ steps.identical.outputs.json-path }}
        run: |
          set -euo pipefail
          echo "exit-code=$EXIT_CODE json-path=$JSON_PATH"
          test "$EXIT_CODE" = "0"
          test -f "$JSON_PATH"
          python -c "
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert not any(data['summary'].values()), data['summary']
          print('action identical diff OK')
          " "$JSON_PATH"

      - name: Diff changed PDFs through the action (expected failure)
        id: changed
        continue-on-error: true
        uses: ./
        with:
          old: web-samples/basic.pdf
          new: web-samples/large.pdf
          fail-on: any
          format: json
          json-path: diff-artifacts/action-changed.json

      - name: Assert the action failed with exit code 1
        env:
          OUTCOME: ${{ steps.changed.outcome }}
          EXIT_CODE: ${{ steps.changed.outputs.exit-code }}
        run: |
          set -euo pipefail
          echo "outcome=$OUTCOME exit-code=$EXIT_CODE"
          test "$OUTCOME" = "failure"
          test "$EXIT_CODE" = "1"

      - name: Diff changed PDFs with fail-on none (expect success and HTML)
        id: tolerant
        uses: ./
        with:
          old: web-samples/basic.pdf
          new: web-samples/large.pdf
          fail-on: none
          format: summary
          report-path: diff-artifacts/action-report.html

      - name: Assert fail-on none succeeds and writes the report
        env:
          EXIT_CODE: ${{ steps.tolerant.outputs.exit-code }}
          REPORT_PATH: ${{ steps.tolerant.outputs.report-path }}
        run: |
          set -euo pipefail
          echo "exit-code=$EXIT_CODE report-path=$REPORT_PATH"
          test "$EXIT_CODE" = "0"
          test -f "$REPORT_PATH"
          grep -q '<!DOCTYPE html>' "$REPORT_PATH"

  audit-cli:
    name: PDF audit CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements.txt reportlab

      - name: Generate sample PDFs
        run: python scripts/generate-web-samples.py

      - name: Audit a sample PDF to JSON (expect exit 0)
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts

          set +e
          python sidecar/cli.py audit web-samples/basic.pdf \
            --format json \
            --output audit-artifacts/basic.json \
            --fail-on none
          code=$?
          set -e

          echo "pdf-inspector exited with $code"
          if [ "$code" -ne 0 ]; then
            echo "::error::expected exit 0 with --fail-on none, got $code"
            exit 1
          fi

      - name: Assert the audit JSON report schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('audit-artifacts/basic.json').read_text(encoding='utf-8'))
          assert data['schemaVersion'] == 1, data['schemaVersion']

          document = data['document']
          assert document['pages'] == 4, document['pages']
          assert isinstance(document['version'], str) and document['version']
          assert document['encrypted'] is False, document['encrypted']
          assert isinstance(document['tagged'], bool), document['tagged']

          summary = data['summary']
          findings = data['findings']
          assert summary['total'] == len(findings), (summary, len(findings))
          assert summary['errors'] == 0, summary
          assert summary['total'] == (
              summary['errors'] + summary['warnings'] + summary['info']
          ), summary

          severities = {'error', 'warning', 'info'}
          categories = {'fonts', 'pages', 'images', 'metadata', 'structure', 'security'}
          for finding in findings:
            assert finding['severity'] in severities, finding
            assert finding['category'] in categories, finding
            assert finding['title'], finding
            assert finding['detail'], finding
            assert finding['page'] is None or isinstance(finding['page'], int), finding

          print('audit JSON OK:', summary)
          PY

      - name: Render the audit HTML report (expect exit 0)
        run: |
          set -euo pipefail

          set +e
          python sidecar/cli.py audit web-samples/basic.pdf \
            --format html \
            --output audit-artifacts/report.html \
            --fail-on none
          code=$?
          set -e

          echo "pdf-inspector exited with $code"
          if [ "$code" -ne 0 ]; then
            echo "::error::expected exit 0 with --fail-on none, got $code"
            exit 1
          fi

          test -s audit-artifacts/report.html
          grep -q '<!DOCTYPE html>' audit-artifacts/report.html
          grep -q 'PDF audit report' audit-artifacts/report.html
          echo "HTML report: $(wc -c < audit-artifacts/report.html) bytes"

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-audit-artifacts
          path: audit-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  audit-action:
    name: PDF audit action
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sample generation dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab

      - name: Generate sample PDFs
        run: python scripts/generate-web-samples.py

      - name: Audit a sample PDF through the action (expect success)
        id: audit
        uses: ./audit
        with:
          path: web-samples/basic.pdf
          fail-on: none
          format: summary
          report-path: audit-artifacts/action-report.html

      - name: Assert the action outputs and report
        env:
          EXIT_CODE: ${{ steps.audit.outputs.exit-code }}
          REPORT_PATH: ${{ steps.audit.outputs.report-path }}
        run: |
          set -euo pipefail
          echo "exit-code=$EXIT_CODE report-path=$REPORT_PATH"
          test "$EXIT_CODE" = "0"
          test -n "$REPORT_PATH"
          test -f "$REPORT_PATH"
          test -s "$REPORT_PATH"
          grep -q '<!DOCTYPE html>' "$REPORT_PATH"
