appId: com.ethancheung.pdfinspector
productName: PDF Inspector
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: dist-sidecar
    to: sidecar
    filter:
      - pdf-inspector-sidecar
      - pdf-inspector-sidecar.exe
win:
  target:
    - nsis
    - portable
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: PDF Inspector
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Office
  # The install prefix is /opt/PDF Inspector (spaces in the product name), which
  # Chromium's zygote cannot exec; start Electron without the sandbox so the
  # generated .desktop entry launches. AppImage already defaults to this flag.
  executableArgs:
    - --no-sandbox
# deb.afterInstall REPLACES electron-builder's generated postinst, so the script
# below re-implements that template's update-alternatives / chrome-sandbox
# logic and then splits the launcher into pdf-inspector-bin (real Electron
# binary) + a sh wrapper that always passes --no-sandbox. That keeps launches
# working when the desktop environment still serves a cached .desktop entry from
# an older install (Exec without the flag).
deb:
  afterInstall: scripts/deb-after-install.sh
mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.productivity
