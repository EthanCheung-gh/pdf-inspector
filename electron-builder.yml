appId: com.ethancheung.pdfinspector
productName: PDF Inspector
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: dist-sidecar
    to: sidecar
    filter:
      - pdf-inspector-sidecar
      - pdf-inspector-sidecar.exe
win:
  target:
    - nsis
    - portable
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: PDF Inspector
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Office
mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.productivity
